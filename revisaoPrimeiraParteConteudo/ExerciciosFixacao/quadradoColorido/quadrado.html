<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadrados com POO</title>
  <style>
    .quadrado {
      width: 100px;
      height: 100px;
      margin: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <button id="btn">Adicionar quadrado</button>
  <div id="area"></div>

  <script>
    // Classe que representa um quadrado
    class Quadrado {
      constructor(cor = "blue") {
        this.cor = cor;
      }

      // Cria o elemento visual no DOM
      criar() {
        const div = document.createElement('div');
        div.classList.add('quadrado');
        div.style.backgroundColor = this.cor;
        return div;
      }
    }

    // Classe que gerencia os quadrados
    class GerenciadorDeQuadrados {
      constructor(area) {
        this.area = area; // elemento do DOM onde os quadrados serão adicionados
      }

      adicionarQuadrado(cor) {
        const quadrado = new Quadrado(cor);
        const elemento = quadrado.criar();
        this.area.appendChild(elemento);
      }
    }

    // --- Execução ---
    const botao = document.getElementById('btn');
    const area = document.getElementById('area');
    const gerenciador = new GerenciadorDeQuadrados(area);

    botao.addEventListener('click', () => {
      gerenciador.adicionarQuadrado("blue");
    });
  </script>
</body>
</html>
