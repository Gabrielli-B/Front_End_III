<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Botões</title>
</head>
<body>
  <div id="area"></div>
  <br>
  <button id="adicionar">Adicionar Botão</button>
  <button id="remover">Remover Todos</button>

  <script>
    class Botao {
      constructor(texto) {
        this.texto = texto;
      }

      criar(container) {
        const btn = document.createElement('button');
        btn.textContent = this.texto; // define o texto do botão
        container.appendChild(btn);   // adiciona o botão ao container
      }
    }

    class GerenciadorDeBotoes {
      constructor(area) {
        this.area = area;
      }

      adicionarBotao(texto) {
        const novoBotao = new Botao(texto);
        novoBotao.criar(this.area);
      }

      removerBotoes() {
        this.area.innerHTML = ''; // limpa todos os botões
      }
    }

    // --- Teste prático ---
    const area = document.getElementById('area');
    const gerenciador = new GerenciadorDeBotoes(area);

    document.getElementById('adicionar').addEventListener('click', () => {
      const texto = prompt('Digite o texto do botão:');
      if (texto) gerenciador.adicionarBotao(texto);
    });

    document.getElementById('remover').addEventListener('click', () => {
      gerenciador.removerBotoes();
    });
  </script>
</body>
</html>
